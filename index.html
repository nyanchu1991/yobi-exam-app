<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予備試験短答式 対策アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c14;
    --bg2: #111420;
    --bg3: #181c2e;
    --surface: #1e2235;
    --surface2: #252a40;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --gold: #c9a84c;
    --gold2: #e8c96a;
    --gold-dim: rgba(201,168,76,0.15);
    --text: #e8e6df;
    --text2: #9a96a0;
    --text3: #5e5a68;
    --red: #e05555;
    --green: #4caf7c;
    --blue: #5b8dee;
    --amber: #e09d3c;
    --radius: 10px;
    --radius2: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
  }

  /* ─── TOP BAR ─── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    font-family: 'Noto Serif JP', serif;
    font-size: 17px; font-weight: 700;
    color: var(--gold2);
    letter-spacing: 0.04em;
  }
  .logo span { color: var(--text2); font-weight: 300; font-size: 13px; margin-left: 8px; }
  .nav-tabs { display: flex; gap: 4px; }
  .nav-tab {
    padding: 7px 16px; border-radius: 8px; border: none;
    background: transparent; color: var(--text2);
    font-size: 13px; cursor: pointer; font-family: inherit;
    transition: all .2s;
  }
  .nav-tab:hover { background: var(--surface); color: var(--text); }
  .nav-tab.active { background: var(--gold-dim); color: var(--gold2); border: 1px solid rgba(201,168,76,0.3); }

  /* ─── MAIN ─── */
  .main { max-width: 820px; margin: 0 auto; padding: 28px 20px; }

  /* ─── HOME ─── */
  .home-hero {
    text-align: center;
    padding: 48px 0 36px;
  }
  .home-hero h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 28px; font-weight: 700;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 10px;
  }
  .home-hero p { color: var(--text2); font-size: 14px; line-height: 1.8; }
  .subject-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px; margin-top: 32px;
  }
  .subject-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius2);
    padding: 20px 18px;
    cursor: pointer;
    transition: all .2s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .subject-card:hover { border-color: var(--gold); background: var(--surface2); transform: translateY(-2px); }
  .subject-card.active-subject { border-color: var(--gold); background: var(--gold-dim); }
  .subject-icon { font-size: 24px; }
  .subject-name { font-size: 15px; font-weight: 500; }
  .subject-meta { font-size: 12px; color: var(--text2); }
  .subject-stat {
    margin-top: auto;
    display: flex; align-items: center; gap: 6px;
  }
  .stat-bar-bg {
    flex: 1; height: 4px; background: var(--border2);
    border-radius: 2px; overflow: hidden;
  }
  .stat-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width .5s; }
  .stat-pct { font-size: 12px; color: var(--gold); font-weight: 500; }

  .start-area { margin-top: 28px; text-align: center; }
  .btn-start {
    background: var(--gold);
    color: #0a0c14;
    border: none; border-radius: 10px;
    padding: 14px 40px;
    font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: all .2s; letter-spacing: 0.03em;
  }
  .btn-start:hover { background: var(--gold2); transform: translateY(-1px); }
  .btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .mode-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .mode-btn {
    padding: 9px 20px; border-radius: 8px;
    border: 1px solid var(--border2); background: var(--surface);
    color: var(--text2); font-size: 13px; cursor: pointer; font-family: inherit;
    transition: all .2s;
  }
  .mode-btn:hover, .mode-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }

  /* ─── QUIZ ─── */
  .quiz-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  .quiz-subject-tag {
    background: var(--gold-dim); color: var(--gold);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 6px; padding: 5px 14px;
    font-size: 13px; font-weight: 500;
  }
  .quiz-progress {
    font-size: 13px; color: var(--text2);
  }
  .progress-bar-bg {
    width: 100%; height: 3px; background: var(--border2);
    border-radius: 2px; overflow: hidden; margin-bottom: 24px;
  }
  .progress-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width .4s; }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius2);
    padding: 28px 28px 24px;
    margin-bottom: 20px;
  }
  .question-num {
    font-size: 12px; color: var(--gold); font-weight: 700;
    letter-spacing: 0.08em; margin-bottom: 14px;
  }
  .question-text {
    font-size: 16px; line-height: 1.85;
    color: var(--text);
    white-space: pre-wrap;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 18px; border-radius: var(--radius);
    border: 1px solid var(--border2); background: var(--bg3);
    color: var(--text); font-size: 14px; line-height: 1.7;
    cursor: pointer; text-align: left; font-family: inherit;
    transition: all .15s;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--gold); background: var(--gold-dim); }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { border-color: var(--green); background: rgba(76,175,124,0.12); }
  .option-btn.wrong { border-color: var(--red); background: rgba(224,85,85,0.1); }
  .option-btn.revealed-correct { border-color: var(--green); background: rgba(76,175,124,0.08); }
  .option-label {
    min-width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
  }
  .correct .option-label, .revealed-correct .option-label { background: var(--green); border-color: var(--green); color: #fff; }
  .wrong .option-label { background: var(--red); border-color: var(--red); color: #fff; }

  .explanation-box {
    background: var(--bg3); border: 1px solid var(--border2);
    border-left: 3px solid var(--gold);
    border-radius: var(--radius); padding: 18px 20px;
    font-size: 14px; line-height: 1.85; color: var(--text2);
    margin-top: 20px; white-space: pre-wrap;
  }
  .explanation-box strong { color: var(--gold); }

  .quiz-actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .btn-next {
    background: var(--gold); color: #0a0c14;
    border: none; border-radius: 8px; padding: 12px 28px;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: all .2s;
  }
  .btn-next:hover { background: var(--gold2); }
  .btn-skip {
    background: transparent; color: var(--text2);
    border: 1px solid var(--border2); border-radius: 8px; padding: 12px 20px;
    font-size: 14px; cursor: pointer; font-family: inherit;
    transition: all .2s;
  }
  .btn-skip:hover { border-color: var(--text2); color: var(--text); }

  /* ─── RESULT ─── */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius2);
    padding: 40px 32px; text-align: center;
    margin-bottom: 24px;
  }
  .result-score { font-size: 64px; font-weight: 700; color: var(--gold2); line-height: 1; }
  .result-score span { font-size: 24px; color: var(--text2); }
  .result-label { font-size: 14px; color: var(--text2); margin-top: 8px; }
  .result-breakdown {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 12px; margin-top: 28px;
  }
  .rb-item { background: var(--bg3); border-radius: var(--radius); padding: 16px; }
  .rb-val { font-size: 22px; font-weight: 700; }
  .rb-lbl { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .rb-item.c { color: var(--green); }
  .rb-item.w { color: var(--red); }
  .rb-item.s { color: var(--text2); }

  .review-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .review-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
  }
  .review-item.wrong-item { border-color: rgba(224,85,85,0.3); }
  .review-q { font-size: 14px; line-height: 1.7; margin-bottom: 8px; }
  .review-meta { font-size: 12px; color: var(--text2); }
  .review-meta .tag {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    margin-right: 6px; font-size: 11px;
  }
  .tag-correct { background: rgba(76,175,124,0.15); color: var(--green); }
  .tag-wrong { background: rgba(224,85,85,0.12); color: var(--red); }

  /* ─── STATS ─── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius2); padding: 20px 18px;
  }
  .stat-card .val { font-size: 28px; font-weight: 700; color: var(--gold2); }
  .stat-card .lbl { font-size: 13px; color: var(--text2); margin-top: 4px; }

  .subject-stats { display: flex; flex-direction: column; gap: 10px; }
  .ss-row {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 18px;
  }
  .ss-name { min-width: 90px; font-size: 14px; }
  .ss-bar-bg { flex: 1; height: 6px; background: var(--border2); border-radius: 3px; overflow: hidden; }
  .ss-bar-fill { height: 100%; border-radius: 3px; transition: width .6s; }
  .ss-pct { min-width: 44px; font-size: 13px; font-weight: 500; text-align: right; }
  .ss-count { min-width: 60px; font-size: 12px; color: var(--text3); text-align: right; }

  /* ─── LOADING ─── */
  .loading-box {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    padding: 80px 20px;
  }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid var(--border2);
    border-top-color: var(--gold);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--text2); font-size: 14px; }

  /* ─── MISC ─── */
  .section-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 18px; font-weight: 700; margin-bottom: 20px;
    color: var(--text);
  }
  .badge-diff {
    display: inline-block; padding: 2px 9px;
    border-radius: 4px; font-size: 11px; font-weight: 700;
    margin-left: 8px;
  }
  .diff-easy { background: rgba(76,175,124,0.15); color: var(--green); }
  .diff-med  { background: rgba(224,157,60,0.15); color: var(--amber); }
  .diff-hard { background: rgba(224,85,85,0.12); color: var(--red); }


  .past-year-badge {
    display: inline-block; padding: 2px 8px;
    border-radius: 4px; font-size: 11px; font-weight: 700;
    background: var(--gold-dim); color: var(--gold);
    margin-right: 6px;
  }
  .past-q-label {
    font-size: 12px; color: var(--text3); margin-bottom: 8px;
  }
  .page { display: none; }
  .page.active { display: block; }

  @media (max-width: 600px) {
    .topbar { padding: 12px 14px; }
    .main { padding: 18px 12px; }
    .question-card { padding: 20px 16px; }
    .result-breakdown { grid-template-columns: 1fr 1fr 1fr; }
    .nav-tab { padding: 6px 10px; font-size: 12px; }
    .logo span { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">司法予備試験<span>短答式対策</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('home')">ホーム</button>
    <button class="nav-tab" onclick="showPage('past')">📚 過去問</button>
    <button class="nav-tab" onclick="showPage('stats')">成績</button>
  </div>
</div>

<div class="main">

  <!-- ── HOME PAGE ── -->
  <div id="page-home" class="page active">
    <div class="home-hero">
      <h1>司法試験予備試験<br>短答式 対策トレーニング</h1>
      <p>AIが本試験レベルの問題を自動生成。7科目対応・解説付き。</p>
    </div>

    <div class="section-title">科目を選択</div>
    <div class="subject-grid" id="subject-grid"></div>

    <div style="margin-top: 28px;">
      <div class="section-title">出題モード</div>
      <div class="mode-selector" id="mode-selector">
        <button class="mode-btn active" data-mode="random" onclick="selectMode(this)">🎲 ランダム</button>
        <button class="mode-btn" data-mode="weak" onclick="selectMode(this)">📌 苦手優先</button>
        <button class="mode-btn" data-mode="year" onclick="selectMode(this)">📅 本試験形式</button>
      </div>
      <div class="section-title">問題数</div>
      <div class="mode-selector" id="count-selector">
        <button class="mode-btn active" data-count="3" onclick="selectCount(this)">3問</button>
        <button class="mode-btn" data-count="5" onclick="selectCount(this)">5問</button>
        <button class="mode-btn" data-count="10" onclick="selectCount(this)">10問</button>
      </div>
      <div class="section-title">難易度</div>
      <div class="mode-selector" id="diff-selector">
        <button class="mode-btn active" data-diff="all" onclick="selectDiff(this)">すべて</button>
        <button class="mode-btn" data-diff="easy" onclick="selectDiff(this)">基礎</button>
        <button class="mode-btn" data-diff="medium" onclick="selectDiff(this)">標準</button>
        <button class="mode-btn" data-diff="hard" onclick="selectDiff(this)">難問</button>
      </div>
    </div>
    <div class="start-area">
      <button class="btn-start" id="btn-start" onclick="startQuiz()">練習を開始する →</button>
    </div>
  </div>

  <!-- ── QUIZ PAGE ── -->
  <div id="page-quiz" class="page">
    <div id="quiz-content"></div>
  </div>

  <!-- ── RESULT PAGE ── -->
  <div id="page-result" class="page">
    <div id="result-content"></div>
  </div>


  <!-- ── PAST EXAM PAGE ── -->
  <div id="page-past" class="page">
    <div class="home-hero" style="padding-bottom:16px;">
      <h1 style="font-size:20px;">過去問モード</h1>
      <p>H28〜R7の本試験問題 憲法・行政法 542問を収録。</p>
    </div>

    <!-- 年度選択 -->
    <div class="section-title">年度を選択</div>
    <div class="mode-selector" id="past-year-selector" style="flex-wrap:wrap;">
      <button class="mode-btn active" data-year="all" onclick="selectPastYear(this)">全年度</button>
      <button class="mode-btn" data-year="R7" onclick="selectPastYear(this)">R7</button>
      <button class="mode-btn" data-year="R6" onclick="selectPastYear(this)">R6</button>
      <button class="mode-btn" data-year="R5" onclick="selectPastYear(this)">R5</button>
      <button class="mode-btn" data-year="R4" onclick="selectPastYear(this)">R4</button>
      <button class="mode-btn" data-year="R3" onclick="selectPastYear(this)">R3</button>
      <button class="mode-btn" data-year="R2" onclick="selectPastYear(this)">R2</button>
      <button class="mode-btn" data-year="R1" onclick="selectPastYear(this)">R1</button>
      <button class="mode-btn" data-year="H30" onclick="selectPastYear(this)">H30</button>
      <button class="mode-btn" data-year="H29" onclick="selectPastYear(this)">H29</button>
      <button class="mode-btn" data-year="H28" onclick="selectPastYear(this)">H28</button>
    </div>

    <!-- 科目選択 -->
    <div class="section-title">科目</div>
    <div class="mode-selector" id="past-subject-selector">
      <button class="mode-btn active" data-subj="all" onclick="selectPastSubj(this)">両科目</button>
      <button class="mode-btn" data-subj="憲法" onclick="selectPastSubj(this)">憲法のみ</button>
      <button class="mode-btn" data-subj="行政法" onclick="selectPastSubj(this)">行政法のみ</button>
    </div>

    <!-- 出題順 -->
    <div class="section-title">出題順</div>
    <div class="mode-selector" id="past-order-selector">
      <button class="mode-btn active" data-order="seq" onclick="selectPastOrder(this)">📋 本試験順</button>
      <button class="mode-btn" data-order="random" onclick="selectPastOrder(this)">🎲 ランダム</button>
    </div>

    <!-- 問題数 -->
    <div class="section-title">問題数</div>
    <div class="mode-selector" id="past-count-selector">
      <button class="mode-btn active" data-count="10" onclick="selectPastCount(this)">10問</button>
      <button class="mode-btn" data-count="20" onclick="selectPastCount(this)">20問</button>
      <button class="mode-btn" data-count="0" onclick="selectPastCount(this)">全問</button>
    </div>

    <div id="past-info" style="font-size:13px;color:var(--text2);margin:12px 0 20px;text-align:center;">
      対象: <span id="past-count-display">542</span>問
    </div>

    <div class="start-area">
      <button class="btn-start" onclick="startPastQuiz()">過去問を解く →</button>
    </div>
  </div>

  <!-- ── STATS PAGE ── -->
  <div id="page-stats" class="page">
    <div class="section-title">学習成績</div>
    <div class="stats-grid" id="stats-overview"></div>
    <div class="section-title" style="margin-top:8px;">科目別 正答率</div>
    <div class="subject-stats" id="subject-stats-list"></div>
  </div>

</div>

<script>
const SUBJECTS = [
  { id: 'kenpo',   name: '憲法',       icon: '⚖️',  color: '#5b8dee' },
  { id: 'minpo',   name: '民法',       icon: '📜',  color: '#4caf7c' },
  { id: 'keipo',   name: '刑法',       icon: '🔒',  color: '#e05555' },
  { id: 'shoho',   name: '商法',       icon: '💼',  color: '#c9a84c' },
  { id: 'minsho',  name: '民事訴訟法', icon: '⚡',  color: '#9b59b6' },
  { id: 'keisho',  name: '刑事訴訟法', icon: '🛡️',  color: '#e09d3c' },
  { id: 'gyosei',  name: '行政法',     icon: '🏛️',  color: '#1abc9c' },
];

let selectedSubjects = new Set(SUBJECTS.map(s => s.id));
let currentMode = 'random';
let currentQuestionCount = 5;
let currentDiff = 'all';
let quizQuestions = [];
let currentQIndex = 0;
let answers = [];
let stats = loadStats();

function loadStats() {
  try { return JSON.parse(localStorage.getItem('yobiStats') || '{}'); } catch { return {}; }
}
function saveStats() {
  try { localStorage.setItem('yobiStats', JSON.stringify(stats)); } catch {}
}
function getSubjectStats(subId) {
  if (!stats[subId]) stats[subId] = { total: 0, correct: 0, wrong: 0 };
  return stats[subId];
}

// ─── RENDER HOME ───
function renderHome() {
  const grid = document.getElementById('subject-grid');
  grid.innerHTML = '';
  SUBJECTS.forEach(s => {
    const ss = getSubjectStats(s.id);
    const pct = ss.total > 0 ? Math.round(ss.correct / ss.total * 100) : 0;
    const el = document.createElement('div');
    el.className = 'subject-card' + (selectedSubjects.has(s.id) ? ' active-subject' : '');
    el.onclick = () => toggleSubject(s.id, el);
    el.innerHTML = `
      <div class="subject-icon">${s.icon}</div>
      <div class="subject-name">${s.name}</div>
      <div class="subject-meta">${ss.total > 0 ? ss.total + '問解答済み' : '未挑戦'}</div>
      <div class="subject-stat">
        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${pct}%;background:${s.color}"></div></div>
        <span class="stat-pct" style="color:${s.color}">${pct}%</span>
      </div>`;
    grid.appendChild(el);
  });
}

function toggleSubject(id, el) {
  if (selectedSubjects.has(id)) {
    if (selectedSubjects.size === 1) return;
    selectedSubjects.delete(id);
    el.classList.remove('active-subject');
  } else {
    selectedSubjects.add(id);
    el.classList.add('active-subject');
  }
}

function selectMode(btn) {
  document.querySelectorAll('#mode-selector .mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = btn.dataset.mode;
}
function selectDiff(btn) {
  document.querySelectorAll('#diff-selector .mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentDiff = btn.dataset.diff;
}

function selectCount(btn) {
  document.querySelectorAll('#count-selector .mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentQuestionCount = parseInt(btn.dataset.count);
}

// ─── QUIZ LOGIC ───
async function startQuiz() {
  const subjects = [...selectedSubjects];
  if (!subjects.length) return alert('科目を選択してください');
  const count = currentQuestionCount;
  showPage('quiz');
  quizQuestions = [];
  currentQIndex = 0;
  answers = [];
  await generateQuestion(subjects, count);
}

async function generateQuestion(subjects, total) {
  const qc = document.getElementById('quiz-content');
  qc.innerHTML = `<div class="loading-box"><div class="spinner"></div><div class="loading-text">AIが問題を生成中…</div></div>`;

  const subjectNames = subjects.map(id => SUBJECTS.find(s => s.id === id).name).join('、');
  const diffStr = currentDiff === 'all' ? '基礎〜難問まで混合' : currentDiff === 'easy' ? '基礎レベル' : currentDiff === 'medium' ? '標準レベル' : '難問レベル';
  const prompt = `あなたは司法試験予備試験の短答式問題作成の専門家です。
以下の条件で問題を${total}問生成してください。

科目: ${subjectNames}
難易度: ${diffStr}
出題モード: ${currentMode === 'weak' ? '苦手問題（ひっかけ・例外・判例知識重視）' : currentMode === 'year' ? '本試験形式（正確な条文・判例問題）' : 'ランダム（バランスよく）'}

【出力フォーマット（JSON配列のみ・マークダウン不要）】
[
  {
    "id": 1,
    "subject": "科目名",
    "difficulty": "easy|medium|hard",
    "question": "問題文（条文・判例・通説に基づく正確な内容）",
    "options": ["選択肢A", "選択肢B", "選択肢C", "選択肢D", "選択肢E"],
    "answer": 0,
    "explanation": "正解の理由と関連条文・判例を含む詳細解説（150字以上）"
  }
]

重要:
- 問題は本試験レベルの正確な内容にすること
- 選択肢は5択（0〜4のインデックスで答え指定）
- 解説は条文番号・判例名・法的根拠を明示
- JSONのみ返す`;

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5',
        max_tokens: 3000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const raw = data.content?.[0]?.text || '';
    const jsonMatch = raw.match(/\[[\s\S]*\]/);
    if (!jsonMatch) throw new Error('JSON parse failed');
    quizQuestions = JSON.parse(jsonMatch[0]);
    showQuestion();
  } catch (e) {
    qc.innerHTML = `<div class="loading-box"><div style="color:var(--red);font-size:14px;">問題の生成に失敗しました。<br><br><button class="btn-skip" onclick="startQuiz()">再試行</button></div></div>`;
  }
}

function showQuestion() {
  if (quizQuestions[currentQIndex]?.is_past) { showPastQuestion(); return; }
  const q = quizQuestions[currentQIndex];
  const qc = document.getElementById('quiz-content');
  const sub = SUBJECTS.find(s => s.name === q.subject) || SUBJECTS[0];
  const diffLabel = q.difficulty === 'easy' ? '基礎' : q.difficulty === 'hard' ? '難問' : '標準';
  const diffClass = q.difficulty === 'easy' ? 'diff-easy' : q.difficulty === 'hard' ? 'diff-hard' : 'diff-med';

  qc.innerHTML = `
    <div class="quiz-header">
      <div><span class="quiz-subject-tag">${q.subject}</span><span class="badge-diff ${diffClass}">${diffLabel}</span></div>
      <div class="quiz-progress">${currentQIndex + 1} / ${quizQuestions.length} 問</div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${(currentQIndex/quizQuestions.length)*100}%"></div></div>
    <div class="question-card">
      <div class="question-num">問 ${currentQIndex + 1}</div>
      <div class="question-text">${q.question}</div>
    </div>
    <div class="options" id="options-list">
      ${q.options.map((opt, i) => `
        <button class="option-btn" onclick="selectAnswer(${i})" id="opt-${i}">
          <span class="option-label">${String.fromCharCode(65+i)}</span>
          <span>${opt}</span>
        </button>`).join('')}
    </div>
    <div id="explanation-area"></div>
    <div class="quiz-actions" id="quiz-actions" style="display:none">
      <button class="btn-next" onclick="nextQuestion()" id="btn-next-q">
        ${currentQIndex + 1 < quizQuestions.length ? '次の問題 →' : '結果を見る'}
      </button>
      <button class="btn-skip" onclick="showExplanationDetail()">解説を見る</button>
    </div>`;
}

function selectAnswer(idx) {
  const q = quizQuestions[currentQIndex];
  const correct = q.answer;
  const isCorrect = idx === correct;

  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === idx) btn.classList.add(isCorrect ? 'correct' : 'wrong');
    if (i === correct && !isCorrect) btn.classList.add('revealed-correct');
  });

  answers.push({ question: q, chosen: idx, correct: isCorrect });

  // update stats
  const ss = getSubjectStats(SUBJECTS.find(s => s.name === q.subject)?.id || 'kenpo');
  ss.total++;
  if (isCorrect) ss.correct++; else ss.wrong++;
  saveStats();

  const expArea = document.getElementById('explanation-area');
  if (q.is_past) {
    const correctLabel = q.answer_display;
    const correctText = q.options[correct];
    expArea.innerHTML = `<div class="explanation-box">
      <strong style="font-size:15px;">${isCorrect ? '✓ 正解' : '✗ 不正解'}</strong>
      ${!isCorrect ? `<span style="margin-left:8px;color:var(--text2);font-size:13px;">正解は <strong style="color:var(--gold);">${correctLabel}</strong>：${correctText}</span>` : ''}
      <div style="margin-top:10px;font-size:12px;color:var(--text3);">${q.year_label}（${q.year}年）本試験 · 問${q.question_no} · ${q.points}点</div>
    </div>`;
  } else {
    const answerLabel = String.fromCharCode(65+correct);
    expArea.innerHTML = `<div class="explanation-box"><strong>${isCorrect ? '✓ 正解' : '✗ 不正解'}</strong>　${q.explanation}</div>`;
  }
  document.getElementById('quiz-actions').style.display = 'flex';
}

function showExplanationDetail() {}

function nextQuestion() {
  currentQIndex++;
  if (currentQIndex >= quizQuestions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

// ─── RESULT ───
function showResult() {
  showPage('result');
  const correct = answers.filter(a => a.correct).length;
  const total = answers.length;
  const pct = Math.round(correct / total * 100);

  const rc = document.getElementById('result-content');
  rc.innerHTML = `
    <div class="section-title">セッション結果</div>
    <div class="result-card">
      <div class="result-score">${pct}<span>%</span></div>
      <div class="result-label">${total}問中 ${correct}問正解</div>
      <div class="result-breakdown">
        <div class="rb-item c"><div class="rb-val">${correct}</div><div class="rb-lbl">正解</div></div>
        <div class="rb-item w"><div class="rb-val">${total - correct}</div><div class="rb-lbl">不正解</div></div>
        <div class="rb-item s"><div class="rb-val">${total}</div><div class="rb-lbl">合計</div></div>
      </div>
    </div>
    <div class="section-title">解答レビュー</div>
    <div class="review-list">
      ${answers.map((a, i) => `
        <div class="review-item ${a.correct ? '' : 'wrong-item'}">
          <div class="review-q">Q${i+1}. ${a.question.question.substring(0, 80)}${a.question.question.length > 80 ? '…' : ''}</div>
          <div class="review-meta">
            <span class="tag ${a.correct ? 'tag-correct' : 'tag-wrong'}">${a.correct ? '正解' : '不正解'}</span>
            <span>${a.question.subject}</span>
            ${!a.correct ? `<span style="font-size:11px;color:var(--text2);display:block;margin-top:6px;">正解: ${a.question.is_past ? a.question.answer_display : String.fromCharCode(65+a.question.answer)}. ${a.question.options[a.question.answer]}</span>` : ''}
          </div>
        </div>`).join('')}
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <button class="btn-start" onclick="startQuiz()">もう一度練習する</button>
      <button class="btn-skip" onclick="showPage('home');renderHome()">ホームへ戻る</button>
    </div>`;
}

// ─── STATS PAGE ───
function renderStats() {
  const overview = document.getElementById('stats-overview');
  let totalQ = 0, totalC = 0;
  SUBJECTS.forEach(s => {
    const ss = getSubjectStats(s.id);
    totalQ += ss.total; totalC += ss.correct;
  });
  const overall = totalQ > 0 ? Math.round(totalC / totalQ * 100) : 0;
  overview.innerHTML = `
    <div class="stat-card"><div class="val">${totalQ}</div><div class="lbl">総解答数</div></div>
    <div class="stat-card"><div class="val">${overall}%</div><div class="lbl">総合正答率</div></div>
    <div class="stat-card"><div class="val">${totalC}</div><div class="lbl">正解数</div></div>
    <div class="stat-card"><div class="val">${totalQ - totalC}</div><div class="lbl">不正解数</div></div>`;

  const list = document.getElementById('subject-stats-list');
  list.innerHTML = SUBJECTS.map(s => {
    const ss = getSubjectStats(s.id);
    const pct = ss.total > 0 ? Math.round(ss.correct / ss.total * 100) : 0;
    return `<div class="ss-row">
      <span class="ss-name">${s.name}</span>
      <div class="ss-bar-bg"><div class="ss-bar-fill" style="width:${pct}%;background:${s.color}"></div></div>
      <span class="ss-pct" style="color:${s.color}">${pct}%</span>
      <span class="ss-count">${ss.total}問</span>
    </div>`;
  }).join('');
}

// ─── NAV ───
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  if (id === 'home') { renderHome(); document.querySelector('.nav-tab:nth-child(1)').classList.add('active'); }
  if (id === 'past') { updatePastInfo(); document.querySelector('.nav-tab:nth-child(2)').classList.add('active'); }
  if (id === 'stats') { renderStats(); document.querySelector('.nav-tab:nth-child(3)').classList.add('active'); }
}

// ─── PAST EXAM STATE ───
let pastYear = 'all';
let pastSubj = 'all';
let pastOrder = 'seq';
let pastCount = 10;

function selectPastYear(btn) {
  document.querySelectorAll('#past-year-selector .mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  pastYear = btn.dataset.year;
  updatePastInfo();
}
function selectPastSubj(btn) {
  document.querySelectorAll('#past-subject-selector .mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  pastSubj = btn.dataset.subj;
  updatePastInfo();
}
function selectPastOrder(btn) {
  document.querySelectorAll('#past-order-selector .mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  pastOrder = btn.dataset.order;
}
function selectPastCount(btn) {
  document.querySelectorAll('#past-count-selector .mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  pastCount = parseInt(btn.dataset.count);
  updatePastInfo();
}
function getPastFiltered() {
  let pool = PAST_Q_DB;
  if (pastYear !== 'all') pool = pool.filter(q => q.year_label === pastYear);
  if (pastSubj !== 'all') pool = pool.filter(q => q.subject === pastSubj);
  return pool;
}
function updatePastInfo() {
  const filtered = getPastFiltered();
  const c = pastCount === 0 ? filtered.length : Math.min(pastCount, filtered.length);
  document.getElementById('past-count-display').textContent = c;
}

function startPastQuiz() {
  let pool = getPastFiltered();
  if (!pool.length) return alert('対象の問題がありません');
  
  if (pastOrder === 'random') {
    pool = [...pool].sort(() => Math.random() - 0.5);
  }
  
  const count = pastCount === 0 ? pool.length : Math.min(pastCount, pool.length);
  const selected = pool.slice(0, count);
  
  // AI生成問題形式に変換
  quizQuestions = selected.map(q => ({
    id: q.id,
    subject: q.subject,
    difficulty: 'medium',
    question: q.label,
    question_detail: q.label,
    options: q.options,
    answer: q.answer,
    answer_display: q.answer_display,
    year_label: q.year_label,
    year: q.year,
    question_no: q.question_no,
    points: q.points,
    type: q.type,
    explanation: '',
    is_past: true
  }));
  
  currentQIndex = 0;
  answers = [];
  showPage('quiz');
  showPastQuestion();
}

function showPastQuestion() {
  const q = quizQuestions[currentQIndex];
  const qc = document.getElementById('quiz-content');
  const sub = SUBJECTS.find(s => s.name === q.subject) || SUBJECTS[0];
  
  qc.innerHTML = `
    <div class="quiz-header">
      <div>
        <span class="past-year-badge">${q.year_label}</span>
        <span class="quiz-subject-tag">${q.subject}</span>
      </div>
      <div class="quiz-progress">${currentQIndex + 1} / ${quizQuestions.length} 問</div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${(currentQIndex/quizQuestions.length)*100}%"></div></div>
    <div class="question-card">
      <div class="past-q-label">問${q.question_no} (${q.year}年 本試験)</div>
      <div class="question-num">問 ${currentQIndex + 1}</div>
      <div class="question-text">${q.question}</div>
    </div>
    <div class="options" id="options-list">
      ${q.options.map((opt, i) => `
        <button class="option-btn" onclick="selectAnswer(${i})" id="opt-${i}">
          <span class="option-label">${i + 1}</span>
          <span>${opt}</span>
        </button>`).join('')}
    </div>
    <div id="explanation-area"></div>
    <div class="quiz-actions" id="quiz-actions" style="display:none">
      <button class="btn-next" onclick="nextQuestion()" id="btn-next-q">
        ${currentQIndex + 1 < quizQuestions.length ? '次の問題 →' : '結果を見る'}
      </button>
    </div>`;
}

renderHome();
